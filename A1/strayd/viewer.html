<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STRAYD // AA01 TACTICAL CATALOG</title>
<style>
:root{
  --bg:#070a0e;
  --panel:#0d1218;
  --panel2:#121922;
  --line:#1f2a38;
  --line-hi:#33455c;
  --txt:#e6edf5;
  --muted:#7d8fa6;
  --amber:#f59e0b;
  --emerald:#10b981;
  --cyan:#38bdf8;
  --crimson:#ef4444;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(circle at top right,#101a26 0%,var(--bg) 52%);
  color:var(--txt);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  padding:16px;
}
.shell{max-width:1380px;margin:0 auto}
.top{
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;
  background:linear-gradient(90deg,#0f1620,#0b1016);
  border:1px solid var(--line-hi);
  border-left:4px solid var(--amber);
  padding:12px 16px;
  margin-bottom:12px;
}
.brand-title{font-size:15px;font-weight:700;letter-spacing:.14em;color:#fff}
.brand-sub{font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.badge-op{
  padding:5px 10px;border:1px solid rgba(245,158,11,.45);
  background:rgba(245,158,11,.08);color:var(--amber);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
}
.kpis{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:8px;margin-bottom:12px;
}
.kpi{
  background:var(--panel);border:1px solid var(--line);padding:10px 12px;
}
.kpi-l{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.kpi-v{font-size:18px;font-weight:700;margin-top:4px;color:#fff}
.kpi-v.em{color:var(--emerald)}.kpi-v.am{color:var(--amber)}.kpi-v.cy{color:var(--cyan)}
.controls{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--panel);border:1px solid var(--line);padding:10px 12px;margin-bottom:12px;
}
input,select{
  background:var(--bg);color:var(--txt);border:1px solid var(--line-hi);
  padding:7px 10px;font-family:inherit;font-size:12px;outline:none;
}
input{flex:1;min-width:240px}
input:focus,select:focus{border-color:var(--cyan)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{
  background:var(--bg);color:var(--muted);border:1px solid var(--line);
  padding:6px 9px;font-family:inherit;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;
}
.pill.active{
  color:#070a0e;background:var(--cyan);border-color:var(--cyan);font-weight:700;
}
.btn-set{
  background:rgba(245,158,11,.12);color:var(--amber);border:1px solid rgba(245,158,11,.45);
  padding:6px 10px;font-family:inherit;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;cursor:pointer;
}
.btn-set:hover{background:rgba(245,158,11,.22)}
.grid-wrap{
  background:var(--panel);border:1px solid var(--line);overflow:auto;max-height:70vh;
}
table{width:100%;border-collapse:collapse}
th{
  position:sticky;top:0;z-index:2;background:#0a0e14;color:var(--muted);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 10px;border-bottom:1px solid var(--line-hi);text-align:left;
  cursor:pointer;user-select:none;
}
th:hover{color:#fff}
td{
  padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;
}
tr:hover td{background:var(--panel2)}
.id-col{color:var(--cyan);font-weight:700;white-space:nowrap}
.title-col{font-weight:600;color:#f8fafc}
.tag{
  display:inline-block;padding:2px 6px;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;border:1px solid transparent;
}
.tag-licensed{color:var(--emerald);background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.35)}
.tag-youtube_only{color:var(--amber);background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.35)}
.tag-both{color:var(--cyan);background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.35)}
.act{
  display:inline-block;padding:3px 7px;margin-right:5px;
  border:1px solid var(--line-hi);color:var(--txt);text-decoration:none;
  font-size:10px;letter-spacing:.06em;background:var(--bg);cursor:pointer;
}
.act:hover{border-color:var(--cyan);color:var(--cyan)}
.act.picked{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.12)}
.dim{color:#475569}
.tray{
  margin-top:12px;background:var(--panel);border:1px solid var(--line-hi);
  padding:10px 12px;display:none;
}
.tray.show{display:block}
.tray-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.tray-list{color:var(--amber);font-size:11px;word-break:break-word}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div>
      <div class="brand-title">STRAYD // AA01 OFFICIAL CATALOG DECK</div>
      <div class="brand-sub" id="opMeta">SECTOR: A1/STRAYD · STANDARD: >=70S VERIFIED</div>

    <div class="badge-op">MIL-SPEC ROSTER · LIVE SYNC</div>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input id="q" type="text" placeholder="SEARCH ID / TITLE / DATE / DOC..." autocomplete="off">
    <div class="pills" id="pills">
      <button class="pill active" data-f="all">ALL</button>
      <button class="pill" data-f="licensed">LICENSED</button>

      <button class="pill" data-f="has_live">LIVE READY</button>

    <select id="sortBy">
      <option value="id">SORT: ID</option>
      <option value="title">SORT: TITLE</option>
      <option value="sourceType">SORT: TYPE</option>
      <option value="releaseDate">SORT: DATE</option>
    </select>
    <button class="btn-set" id="toggleTray">SETLIST (<span id="setCount">0</span>)</button>
  </div>

  <div class="tray" id="tray">
    <div class="tray-top">
      <span class="kpi-l" style="color:var(--amber)">ACTIVE SETLIST QUEUE</span>
      <div>
        <button class="act" id="copySet">COPY QUEUE</button>
        <button class="act" id="clearSet">CLEAR</button>
      </div>
    </div>
    <div class="tray-list" id="trayList">NO TRACKS QUEUED.</div>
  </div>

  <div class="grid-wrap">
    <table>
      <thead>
        <tr>
          <th data-k="id">ID</th>
          <th data-k="title">TRACK TITLE</th>
          <th data-k="sourceType">STATUS</th>
          <th data-k="releaseDate">RELEASE</th>
          <th>DOC / ART</th>
          <th>COMMS & LINKS</th>
          <th>QUEUE</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const DB = JSON.parse(document.getElementById("catalogData").textContent);
const songs = Array.isArray(DB.songs) ? DB.songs : [];
let mode = "all";
const queue = new Set();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function renderKpis(filteredCount){
  const lic = songs.filter(x => x.sourceType === "licensed").length;
  const ytOnly = songs.filter(x => x.sourceType === "youtube_only").length;
  const both = songs.filter(x => x.sourceType === "both").length;
  const live = songs.filter(x => x.liveAlbum).length;
  document.getElementById("kpis").innerHTML = [
    ["ROSTER TOTAL", songs.length, ""],
    ["LICENSED", lic, "em"],
    ["YOUTUBE ONLY", ytOnly, "am"],
    ["DUAL / BOTH", both, "cy"],
    ["LIVE ALBUM", live, ""],
    ["SHOWN", filteredCount, "cy"]
  ].map(([l,v,c]) => `<div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v ${c}">${v}</div></div>`).join("");
}

function renderTray(){
  const arr = [...queue];
  document.getElementById("setCount").textContent = arr.length;
  document.getElementById("trayList").textContent = arr.length ? arr.join("  |  ") : "NO TRACKS QUEUED.";
}

function render(){
  const q = document.getElementById("q").value.trim().toLowerCase();
  const sKey = document.getElementById("sortBy").value;

  let list = songs.filter(x => {
    if (mode === "licensed" && x.sourceType !== "licensed") return false;
    if (mode === "youtube_only" && x.sourceType !== "youtube_only") return false;
    if (mode === "both" && x.sourceType !== "both") return false;
    if (mode === "has_doc" && !x.doc) return false;
    if (mode === "has_live" && !x.liveAlbum) return false;
    if (!q) return true;
    const hay = `${x.id} ${x.title} ${x.sourceType} ${x.releaseDate || ""} ${x.doc || ""}`.toLowerCase();
    return hay.includes(q);
  });

  list = [...list].sort((a,b) => String(a[sKey] ?? "").localeCompare(String(b[sKey] ?? ""), undefined, {numeric:true}));
  renderKpis(list.length);

  document.getElementById("tbody").innerHTML = list.map(x => {
    const tClass = "tag-" + (x.sourceType || "licensed");
    const links = [];
    if (x.youtube) links.push(`<a class="act" target="_blank" rel="noopener" href="${esc(x.youtube)}">YT</a>`);
    if (x.liveAlbum) links.push(`<a class="act" target="_blank" rel="noopener" href="${esc(x.liveAlbum)}">LIVE</a>`);
    if (x.portal) links.push(`<a class="act" target="_blank" rel="noopener" href="${esc(x.portal)}">PORTAL</a>`);
    const metaFile = x.doc ? esc(x.doc) : `<span class="dim">NO_DOC</span>`;
    const picked = queue.has(x.id);
    return `<tr>
      <td class="id-col">${esc(x.id)}</td>
      <td class="title-col">${esc(x.title)}</td>
      <td><span class="tag ${tClass}">${esc(x.sourceType)}</span></td>
      <td>${x.releaseDate ? esc(x.releaseDate) : `<span class="dim">—</span>`}</td>
      <td>${metaFile}</td>
      <td>${links.length ? links.join("") : `<span class="dim">PENDING</span>`}</td>
      <td><button class="act ${picked ? "picked" : ""}" data-pick="${esc(x.id)}">${picked ? "QUEUED" : "+SET"}</button></td>
    </tr>`;
  }).join("");
}

document.getElementById("q").addEventListener("input", render);
document.getElementById("sortBy").addEventListener("change", render);

document.querySelectorAll("th[data-k]").forEach(th => {
  th.addEventListener("click", () => {
    document.getElementById("sortBy").value = th.dataset.k;
    render();
  });
});

document.getElementById("pills").addEventListener("click", e => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  document.querySelectorAll(".pill").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  mode = btn.dataset.f;
  render();
});

document.getElementById("tbody").addEventListener("click", e => {
  const btn = e.target.closest("button[data-pick]");
  if (!btn) return;
  const id = btn.dataset.pick;
  if (queue.has(id)) queue.delete(id); else queue.add(id);
  renderTray();
  render();
});

document.getElementById("toggleTray").addEventListener("click", () => {
  document.getElementById("tray").classList.toggle("show");
});

document.getElementById("clearSet").addEventListener("click", () => {
  queue.clear();
  renderTray();
  render();
});

document.getElementById("copySet").addEventListener("click", () => {
  const text = [...queue].join(", ");
  if (text && navigator.clipboard) navigator.clipboard.writeText(text);
});

document.getElementById("opMeta").textContent =
  `ARTIST: ${DB.artist || "STRAYD"} · MIN_DUR: ${DB.minSeconds || 70}S · TRACKS: ${songs.length}`;

renderTray();
render();
</script>
